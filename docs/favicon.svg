<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="15" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Glowing outer circle -->
  <circle cx="256" cy="256" r="220" stroke="url(#grad1)" stroke-width="12" stroke-dasharray="24 12" filter="url(#glow)" />
  <circle cx="256" cy="256" r="180" stroke="#1e293b" stroke-width="4" />

  <!-- Stylized G -->
  <path d="M 330 180 A 110 110 0 1 0 330 332 L 256 332" stroke="url(#grad1)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
        
  <!-- Stylized I -->
  <path d="M 256 160 L 256 352" stroke="#ffffff" stroke-width="24" stroke-linecap="round" />
        
  <!-- Glowing LED dots -->
  <circle cx="256" cy="110" r="12" fill="#00f0ff" filter="url(#glow)" />
  <circle cx="256" cy="402" r="12" fill="#00f0ff" filter="url(#glow)" />
</svg>